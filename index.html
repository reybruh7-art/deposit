<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Deposit Bimbel ABE-Q</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800">Dashboard Manajemen Deposit</h1>
            <p class="text-slate-500 text-sm">Kelola deposit saldo, sisa sesi, dan kirim laporan WhatsApp otomatis sekali klik (Rp5.000 / sesi).</p>
        </header>

        <!-- Form Tambah -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-8">
            <h2 class="text-lg font-semibold text-slate-700 mb-4">Tambah Data Siswa Baru</h2>
            <form id="studentForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="childName" placeholder="Nama Anak" class="px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                <input type="text" id="parentPhone" placeholder="No. WA Orang Tua (cth: 08123...)" class="px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                <input type="number" id="depositAmount" placeholder="Jumlah Deposit Awal (Rp, cth: 50000)" class="px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                <button type="submit" class="md:col-span-3 bg-indigo-600 text-white font-medium py-2.5 rounded-xl hover:bg-indigo-700 transition">Simpan Data Siswa</button>
            </form>
        </div>

        <!-- Daftar Siswa & Kolom Pencarian -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex flex-col md:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-semibold text-slate-700">Daftar Sisa Deposit Siswa</h2>
                <!-- Kotak Pencarian Nama Anak / No Telepon -->
                <input type="text" id="searchBox" placeholder="🔍 Cari nama anak / no WA..." class="w-full md:w-80 px-4 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div id="studentList" class="divide-y divide-slate-100">
                <p class="p-6 text-center text-slate-400">Memuat data...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB0V6DnuTc8L2Y50wFfyzH5fydhx2DSDEM",
            authDomain: "deposit-cf8a4.firebaseapp.com",
            projectId: "deposit-cf8a4",
            storageBucket: "deposit-cf8a4.firebasestorage.app",
            messagingSenderId: "1099129729826",
            appId: "1:1099129729826:web:d40eee60b40c6ebd1d6b79",
            measurementId: "G-DEEPY7GGDF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const studentForm = document.getElementById('studentForm');
        const studentList = document.getElementById('studentList');
        const searchBox = document.getElementById('searchBox');

        const PRICE_PER_SESSION = 5000;
        let allStudents = [];

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        async function loadStudents() {
            try {
                const querySnapshot = await getDocs(collection(db, "deposits"));
                allStudents = [];
                querySnapshot.forEach((docSnap) => {
                    allStudents.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderStudents(allStudents);
            } catch (error) {
                console.error("Gagal memuat:", error);
                studentList.innerHTML = `<p class="p-6 text-center text-rose-500">Gagal memuat data dari database.</p>`;
            }
        }

        function renderStudents(dataArray) {
            if (dataArray.length === 0) {
                studentList.innerHTML = `<p class="p-6 text-center text-slate-400">Tidak ada data siswa yang ditemukan.</p>`;
                return;
            }

            let html = '';
            dataArray.forEach((student) => {
                const totalRupiah = student.deposit;
                const sisaSesi = Math.floor(totalRupiah / PRICE_PER_SESSION);

                html += `
                    <div class="p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:bg-slate-50/50 transition">
                        <div>
                            <h3 class="font-bold text-slate-800 text-lg">${student.childName}</h3>
                            <p class="text-sm text-slate-500">WA: ${student.parentPhone}</p>
                            <div class="flex flex-wrap gap-2 mt-2 text-xs text-slate-600">
                                <span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-semibold">
                                    Deposit: ${formatRupiah(totalRupiah)} / ${sisaSesi} Sesi
                                </span>
                                <span class="self-center">Update Terakhir: ${student.lastUpdated || '-'}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto">
                            <button onclick="cutSession('${student.id}', '${student.childName}', ${student.deposit}, '${student.parentPhone}')" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl transition shadow-sm">
                                Selesai Sesi & Kirim WA
                            </button>
                            <button onclick="deleteStudent('${student.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 p-2.5 rounded-xl transition text-sm" title="Hapus">🗑️</button>
                        </div>
                    </div>
                `;
            });
            studentList.innerHTML = html;
        }

        // Fitur Filter Pencarian Berdasarkan Nama Anak ATAU No Telepon
        searchBox.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.childName.toLowerCase().includes(keyword) || 
                s.parentPhone.toLowerCase().includes(keyword)
            );
            renderStudents(filtered);
        });

        studentForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const childName = document.getElementById('childName').value;
            const parentPhone = document.getElementById('parentPhone').value;
            const depositAmount = Number(document.getElementById('depositAmount').value);

            try {
                await addDoc(collection(db, "deposits"), {
                    childName,
                    parentPhone,
                    deposit: depositAmount,
                    lastUpdated: '-'
                });
                studentForm.reset();
                loadStudents();
            } catch (error) {
                alert("Gagal menyimpan data!");
            }
        });

        window.cutSession = async function(id, childName, currentDeposit, parentPhone) {
            if (currentDeposit < PRICE_PER_SESSION) {
                alert("Deposit uang anak ini sudah tidak cukup untuk 1 sesi!");
                return;
            }

            const newDeposit = currentDeposit - PRICE_PER_SESSION;
            const newSesi = Math.floor(newDeposit / PRICE_PER_SESSION);
            const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

            try {
                const studentRef = doc(db, "deposits", id);
                await updateDoc(studentRef, {
                    deposit: newDeposit,
                    lastUpdated: today
                });

                let formattedPhone = parentPhone.trim();
                if (formattedPhone.startsWith('0')) {
                    formattedPhone = '62' + formattedPhone.slice(1);
                }

                const message = `Halo Kak/Bapak/Ibu Orang Tua dari *${childName}*,\n\nInformasi sesi belajar selesai pada hari ini (*${today}*).\n\n• Sisa Deposit Terakhir: *${formatRupiah(newDeposit)} (${newSesi} Sesi)*\n\nTerima kasih telah mempercayakan bimbingan kami! 🙏`;
                
                window.open(`https://wa.me/${formattedPhone}?text=${encodeURIComponent(message)}`, '_blank');
                loadStudents();
            } catch (error) {
                alert("Gagal memproses sesi.");
            }
        }

        window.deleteStudent = async function(id) {
            if (window.confirm("Yakin ingin menghapus data siswa ini?")) {
                await deleteDoc(doc(db, "deposits", id));
                loadStudents();
            }
        }

        loadStudents();
    </script>
</body>
</html>
